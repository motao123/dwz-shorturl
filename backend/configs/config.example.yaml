server:
  port: 8080
  mode: release
database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: dwz_admin
  charset: utf8mb4
# Public frontend DB (holds the `members` table). Leave user/dbname empty to
# disable member management without breaking startup.
public_db:
  host: 127.0.0.1
  port: 3306
  user: ""
  password: ""
  dbname: ""
  charset: utf8mb4
# CORS: only these origins may make credentialed cross-origin requests.
# Empty = same-origin only (all cross-origin requests refused).
cors:
  allowed_origins: []
redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
jwt:
  secret: "change-me-to-random-32-bytes!!"
  # Previous secrets still accepted during key rotation (tokens signed with an
  # old secret remain valid). Keep empty unless rotating.
  previous_secrets: []
  access_expiry: 2h
  refresh_expiry: 168h
public:
  # 站点对外地址，必须改成你自己的域，例如 https://links.example.com。
  # 留空时短链地址会退化为相对路径、续期邮件里也不再附会员中心链接，
  # 并且服务启动时会打一条 warn —— 不要再照抄示例里的域名上线（#20）。
  base_url: ""
  trusted_proxies: []
rate_limit:
  single_max: 20
  single_window: 60
  batch_max: 100
  batch_window: 60
log:
  level: info
  file: ""

# Outgoing mail (SMTP). OPTIONAL, but without it:
#   - "forgot password" cannot send the reset link (users are locked out);
#   - member email verification never arrives, and batch creation requires a
#     verified email -> batch stays unusable for self-hosted instances.
# Leave host/user/password empty to disable mail (endpoints then return an
# explicit "mail service not configured" error instead of silently failing).
smtp:
  host: ""              # e.g. smtp.qq.com / smtp.aliyun.com
  port: 465             # 465 = implicit TLS, 587 = STARTTLS
  user: ""              # full mailbox address, e.g. noreply@example.com
  password: ""          # SMTP authorization code (NOT the mailbox login password)
  from: ""              # sender address shown to recipients
  from_name: "短网址"  # sender display name
  ssl: true

# GeoIP country resolution for click analytics. Set db_path to an ip2region v1
# database file (e.g. /www/server/dwz-admin/data/ip2region.db). Empty disables
# country resolution (click_logs.country stays blank).
geoip:
  db_path: ""
