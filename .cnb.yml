# ============================================================
# CNB 云原生构建流水线
#
# 两条流水线，职责分离：
#   1. dependency-risk-check — PR 阶段做「增量」依赖风险检查，只对本次 PR
#      新引入的漏洞 / License 风险阻断，历史遗留告警不阻断。
#      背景：本项目依赖曾长期落后（golang.org/x/crypto 0.25.0、
#      echarts 5.6.0 等），平台安全页因此累积大量存量告警。若在 PR
#      阶段做全量门禁，任何一个 PR 都会被历史告警卡死；只有增量门禁
#      才能让「新引入的风险」真正被拦住，同时不被存量噪音淹没。
#      配套：依赖自动升级见 .github/dependabot.yml
#            平台仓库级扫描范围配置见 .cnb/security/code_scan_config.yml
#   2. test-gate — Go / 前端 / PHP 全量单测与语法检查。
#      背景：此前仓库没有任何测试门禁，master 上的 Go 单测失败
#      （migration 注册表契约）长期无人发现，「回归」不可观测。
#      该流水线同时挂在 pull_request 与 push 上：PR 卡住新引入的问题，
#      push 兜住直接推到分支的情况，让 master 的红灯无法再被忽略。
# ============================================================

# 所有分支的 PR 都执行（含 master 与 auto/* 等特性分支）
"**":
  pull_request:
    - name: dependency-risk-check
      # 扫描为轻量任务，降低规格以节省资源
      runner:
        cpus: 4
      stages:
        # 新增依赖漏洞门禁：PR 新引入 high / critical 漏洞时失败
        - name: 新增依赖漏洞扫描
          image: cnbcool/sca-vulnerability:latest
          settings:
            failOnSeverity: high

        # 新增 License 风险门禁：GPL 等高风险 License 新引入时失败
        - name: 新增 License 风险扫描
          image: cnbcool/sca-license:latest
          settings:
            failOnSeverity: high

        # 生成组件变化清单（只产出报告，不阻断）
        - name: 生成 SBOM Delta
          image: cnbcool/sca-sbom:latest
          settings:
            output: ${CNB_BUILD_WORKSPACE}/.cnb-sca/sbom-delta.json

    # 测试门禁与依赖扫描并行，互不阻塞；单测本就需要比扫描更多的内存。
    - name: test-gate
      runner:
        cpus: 4
      # 备份→恢复演练要跑真 MySQL：用假数据或纯静态检查都不足以证明"备份能恢复"，
      # 那正是本批要修的东西。MySQL 直接在 stage 容器内起（见该 stage 说明），
      # 否则脚本连不上 127.0.0.1:3306；services: docker 仍然需要，因为 drill 镜像
      # 是 docker CLI 镜像，且构建环境声明在 docker.build 下。
      services:
        - docker
      # 流水线级默认构建环境 = drill 镜像（docker CLI + bash/gzip + mysql 服务端/客户端）。
      # 只有「备份→恢复演练」stage 用默认环境；其余 stage 各自声明 image 覆盖。
      # 必须放在 pipeline 级：Stage 不支持 docker.build，只有 image。
      docker:
        build:
          dockerfile: deploy/docker/drill/Dockerfile
      stages:
        # --- Go：编译 + 单测 -------------------------------------------------
        # 任一阶段失败即中断，不再往下跑（快速失败）。
        - name: Go 编译与单测
          image: golang:1.26
          script: |
            set -e
            go version
            cd backend
            go vet ./...
            go build ./...
            go test ./...

        # --- PHP：全量语法检查（用 8.2 对齐运行时）----------------------------
        # #60：运行时基线是 deploy/docker/Dockerfile.web 的 php:8.2-fpm-alpine，
        # 文档承诺 PHP 8.0+。此前这里用 php:8.4-cli，8.3/8.4 的新语法能过 CI
        # 却在 8.2 生产直接 fatal —— lint 版本必须 ≤ 运行时版本才拦得住。
        - name: PHP 语法检查
          image: php:8.2-cli
          script: |
            set -e
            php -v
            fail=0
            # 逐个文件校验；find 排除依赖与产物目录，避免检查第三方代码。
            # 注意：CNB 阶段脚本默认由 /bin/sh(dash) 执行，不能用 <(...) 这类
            # bash 专有进程替换（会报 Syntax error: redirection unexpected，
            # 返回码 2，导致后续阶段全部跳过）。因此先把文件列表写入临时文件，
            # 再用普通重定向逐行读取。
            files=$(mktemp)
            find . -name '*.php' \
              -not -path './node_modules/*' \
              -not -path './frontend/node_modules/*' \
              -not -path './vendor/*' > "$files"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if ! out=$(php -l "$f" 2>&1); then
                echo "$out"
                fail=1
              fi
            done < "$files"
            rm -f "$files"
            if [ "$fail" -ne 0 ]; then
              echo "PHP 语法检查失败"
              exit 1
            fi
            echo "PHP 语法检查通过"

        # --- 安全配置断言 -----------------------------------------------------
        # XFF 必须使用覆盖式赋值。追加式（$proxy_add_x_forwarded_for）会把
        # 客户端自带的 X-Forwarded-For 带进后端，访客可据此伪造来源 IP，
        # 绕过限流与登录锁定、污染地域统计。这类配置错误不会让任何测试变红，
        # 只能靠一条 grep 守住；注释里的说明不算违规，所以只看赋值行。
        - name: 反代 XFF 赋值方式检查
          image: alpine:3.20
          script: |
            set -e
            hits=$(grep -rInE '^[[:space:]]*proxy_set_header[[:space:]]+X-Forwarded-For[[:space:]]+\$proxy_add_x_forwarded_for' --include='*.conf' --include='*.yml' --include='*.yaml' --exclude-dir=node_modules . || true)
            if [ -n "$hits" ]; then
              echo "发现追加式 X-Forwarded-For 赋值（可被伪造 IP）："
              echo "$hits"
              echo "请改为：proxy_set_header X-Forwarded-For \$remote_addr;"
              exit 1
            fi
            echo "XFF 赋值方式检查通过"
        # --- 备份→恢复演练（真 MySQL，端到端）---------------------------------
        # 这是本批唯一"不是静态检查"的门禁，也是最该有的一条：备份的价值只由
        # "能恢复"定义，而"能恢复"只有把 dump 真的导进一个库才知道。在本 stage
        # 容器内直接启动一个真 mysqld，跑 deploy/backup.sh 出 dump，再跑
        # deploy/restore.sh --check 导入临时库比对表数量 —— 失败即说明备份链路坏了。
        - name: 备份→恢复演练
          # 注意：这里**不能**写 stage/job 级的 docker.build —— Stage 只支持 image，
          # job 级的 docker 键会被静默忽略（平台校验器也不报错），于是本 stage 会退回
          # 默认构建环境 cnbcool/default-build-env，那里没有 mysqldump，backup.sh 直接
          # "mysqldump: command not found"（PR #48 首次真跑就踩了这个静默坑）。
          # 正确做法：把 drill 镜像声明在 **pipeline 级** docker.build（见本流水线头部），
          # 本 stage 不写 image，即继承该默认环境；其它 stage 各自用 image 覆盖。
          script: |
            set -e
            # 运行期预检：镜像里必须同时有 mysqld 与 mysqldump。CNB 以 dockerfile 声明
            # 构建环境时按内容缓存镜像，缓存命中就沿用旧层 —— 依赖包改了、镜像没跟着
            # 更新时，backup.sh 只会抛一句没头没尾的 "command not found"。这里先自证
            # 环境，缺什么直接红并打印诊断（DRILL_ENV_REV 已 +1 表示依赖变更）。
            echo "--- 演练环境自检"
            for bin in mysql mysqladmin mysqldump mysqld mariadb-install-db gzip bash; do
              if ! command -v "$bin" >/dev/null 2>&1; then
                echo "演练环境缺少 $bin：镜像未按 deploy/docker/drill/Dockerfile 重建"
                echo "（该镜像被缓存时不会自动跟着 Dockerfile 变化重建；确认 DRILL_ENV_REV 已 +1）"
                exit 1
              fi
            done
            mysql --version
            mysqld --version
            echo "演练环境自检通过"

            # 这里**不通过容器跑 MySQL，也不做任何端口映射/容器名解析**，
            # 而是在本 stage 容器内直接起一个 mysqld —— 因为备份/恢复脚本就在
            # 这个容器里执行，连 127.0.0.1:3306 必须由它自己监听。
            #
            # 为什么会走到这一步（三轮 CI 实测结论，别再回退成容器方案）：
            #   1) `-p 33061:3306` + 从容器连 127.0.0.1:33061 → 2002 (115 EINPROGRESS)；
            #   2) 改用 `--network host`（容器内 127.0.0.1:3306 可达）后，
            #      stage 容器**不是** host netns（CNB 构建容器有自己的 netns），
            #      它看到的 127.0.0.1 是它自己，所以仍然连不上。
            # 一句话：MySQL 在别的 netns 里，"连 127.0.0.1 由谁监听"就对不上。
            # 容器内直起 mysqld 则天然满足脚本的连接方式，也不再需要 docker-in-docker
            # 拉 mysql 镜像（少一次 ~25s 的镜像拉取）。
            # 说明：这与生产部署方式无关（生产是 docker compose），只是把 MySQL 放在
            # 与脚本同一个 netns 里，保证演练测的是备份/恢复链路本身。
            echo "=== 启动 MySQL（stage 容器内）"
            mkdir -p /run/mysqld /var/lib/mysql /tmp/mysql-logs
            chown -R mysql:mysql /run/mysqld /var/lib/mysql /tmp/mysql-logs
            # root@127.0.0.1 需要 TCP 登录（--protocol=TCP 走的就是 TCP，不走 socket）。
            # 只创建 root@localhost 会得到 "Access denied for user 'root'@'127.0.0.1'"。
            mysql_create_root() {
              mysql --socket=/run/mysqld/mysqld.sock -uroot -e "
                CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'drillroot';
                GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
                ALTER USER 'root'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('drillroot');
                FLUSH PRIVILEGES;"
            }
            # 初始化数据目录。必须按**服务端 flavor** 分流：
            #   - MariaDB（Alpine 的 `mariadb` 包，本镜像就是它）**没有**
            #     `--initialize-insecure` —— 那是 MySQL 8 专属参数，用了会
            #     "unknown option '--initialize-insecure'" 后立即 Abort
            #     （实测该 stage 0.4s 红）。MariaDB 用 `mariadb-install-db`。
            #   - MySQL 才用 `--initialize-insecure`。
            # 判据取 `mysqld --version` 的实际输出，不再靠"包名想当然"。
            init_datadir() {
              [ -d /var/lib/mysql/mysql ] && return 0
              echo "初始化数据目录（约 20-30s）..."
              if mysqld --version 2>&1 | grep -qi 'mariadb'; then
                echo "检测到 MariaDB 服务端，使用 mariadb-install-db"
                mariadb-install-db --user=mysql --datadir=/var/lib/mysql --skip-test-db >/dev/null
              else
                echo "检测到 MySQL 服务端，使用 --initialize-insecure"
                mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql
              fi
            }

            init_datadir
            # ⚠️ Alpine 的 mariadb 包在 /etc/my.cnf.d/mariadb-server.cnf 里**默认写死
            # \`skip-networking\`**（Alpine aports main/mariadb/APKBUILD 里可查）——
            # 于是 mysqld 只开 unix socket，TCP 完全不监听。日志里表现为
            # "ready for connections ... port: 0"，而 socket ping 却是通的：
            # 第 6 轮 CI 就是这样 —— 初始化过了、socket 就绪了，宿主侧 TCP 自检
            # 却连不上 127.0.0.1:3306，白白耗掉 60s 才失败。
            # 命令行显式 \`--skip-networking=0\` 覆盖配置文件里的开关，强制开 TCP。
            nohup mysqld --skip-networking=0 --user=mysql --datadir=/var/lib/mysql \
              --socket=/run/mysqld/mysqld.sock --port=3306 --bind-address=127.0.0.1 \
              --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci \
              >/tmp/mysql-logs/mysqld.log 2>&1 &
            echo "等待 MySQL 就绪..."
            READY=0
            for i in $(seq 1 60); do
              if mysqladmin --socket=/run/mysqld/mysqld.sock -uroot ping >/dev/null 2>&1; then echo "就绪(${i}s)"; READY=1; break; fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo "MySQL 未能在 120s 内就绪"
              tail -n 50 /tmp/mysql-logs/mysqld.log
              exit 1
            fi
            # TCP 端口自证：socket 通了**不代表** TCP 在听。Alpine 的 mariadb 默认
            # 带了 skip-networking，socket ping 照样 OK 但 TCP 是 0 端口。这里直接
            # 断言端口已监听，把问题定位到"没开 TCP"这一层，而不是拖到 60s 超时后
            # 只留一句"宿主侧连不上 127.0.0.1:3306"。
            if ! grep -qiE 'port:[[:space:]]*3306' /tmp/mysql-logs/mysqld.log; then
              echo "mysqld 未监听 TCP 3306（日志无 'port: 3306'，多半是被 skip-networking 关了）"
              grep -iE 'port:|networking' /tmp/mysql-logs/mysqld.log | tail -5
              exit 1
            fi
            mysql_create_root

            # 自证连通性：**宿主侧进程**（backup.sh/restore.sh 所处位置）用 TCP 直连。
            # 这条断言把"服务端起来了"与"脚本真的连得上"分开 —— 前两轮 CI 的失败
            # 都是两者不一致，却拖到 backup.sh 才以一句 2002 暴露。
            echo "--- 宿主到 MySQL 连通性自检"
            for i in $(seq 1 30); do
              if MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP -N -B -e 'SELECT 1' >/dev/null 2>&1; then
                echo "宿主侧连通 OK（127.0.0.1:3306）"; break
              fi
              if [ "$i" -eq 30 ]; then
                echo "宿主侧连不上 127.0.0.1:3306"
                tail -n 50 /tmp/mysql-logs/mysqld.log
                exit 1
              fi
              sleep 2
            done

            # 建两个库并灌入真实 schema（用仓库里的迁移文件，不用假数据）。
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP -e "CREATE DATABASE dwz_admin CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE dwz_public CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP dwz_admin < backend/migrations/schema.sql
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP dwz_public < backend/migrations/php/add_webhook_queue.sql

            export DB_HOST=127.0.0.1 DB_PORT=3306
            export DB_ADMIN_USER=root DB_ADMIN_PASS=drillroot DB_ADMIN_NAME=dwz_admin
            export DB_PUBLIC_USER=root DB_PUBLIC_PASS=drillroot DB_PUBLIC_NAME=dwz_public
            export BACKUP_DIR=/tmp/dwz-backups
            mkdir -p "$BACKUP_DIR"

            echo "--- 备份"
            # 显式断言备份成功且真的产出了两份非空 dump。
            # #55 教训：backup.sh 历史上会把失败当成功返回 0，只靠 "脚本没报错"
            # 判定备份成功等于没验；这里用产物存在性做二次兜底。
            #
            # ⚠️ 第 7 轮真跑曾在这里"两库都备份成功、然后没有然后了"并返回 1：
            # backup.sh 末尾的备份轮转用了 GNU 专属的 `find -printf`，而本 stage 的
            # drill 镜像是 **Alpine**，busybox `find` 不认 `-printf` → 非 0 退出，
            # 报错又被脚本里的 2>/dev/null 吞掉。已改为 `find … -exec stat -c '%Y %n' {} +`
            # （GNU/busybox 语义一致），并在部署门禁加了禁止 `-printf` 的静态断言。
            # 所以：**本 stage 的脚本必须同时兼容 GNU 与 busybox 工具链**。
            bash deploy/backup.sh
            ls -la "$BACKUP_DIR"
            for f in "$BACKUP_DIR"/dwz_admin-*.sql.gz "$BACKUP_DIR"/dwz_public-*.sql.gz; do
              [ -s "$f" ] || { echo "备份产物缺失或为空：$f"; exit 1; }
              gzip -t "$f" || { echo "备份产物 gzip 校验失败：$f"; exit 1; }
            done
            echo "备份成功：两份 dump 均非空且 gzip 合法"

            echo "--- 恢复演练（必须 PASS）"
            bash deploy/restore.sh --check

            echo "--- 残档防护 A：显式指定截断的 dump 必须被拒（非 0 退出）"
            printf 'CREATE TABLE t(id int);\n' | gzip -9 > /tmp/truncated.sql.gz
            if bash deploy/restore.sh --admin-only --check --file=/tmp/truncated.sql.gz 2>/dev/null; then
              echo "截断的 dump 被当成有效备份 -> 失败"; exit 1
            fi
            echo "截断 dump 已被正确拒绝"

            echo "--- 残档防护 B：目录里最新的 dump 是残档时，必须跳过它用完整的那个"
            # 造一个 mtime 最新的截断残档，放在与完整 dump 同一个目录。
            cp /tmp/truncated.sql.gz "$BACKUP_DIR/dwz_admin-20990101-000000.sql.gz"
            touch "$BACKUP_DIR/dwz_admin-20990101-000000.sql.gz"
            bash deploy/restore.sh --admin-only --check
            echo "残档已被跳过，演练用的是完整 dump"

      # --- 部署脚本与清单门禁（#16 / #55 / #61）-------------------------------
      # 部署相关的问题不会让任何单测变红：#9 那种"COPY 一个不存在的文件"
      # 只有真 docker build 才会暴露；#16 的清单漂移只有对比两份列表才知道。
      # 这里用 shellcheck + bash -n + 清单一致性 + 关键 COPY 存在性做静态门禁，
      # 在不引入 docker-in-docker 的前提下覆盖住"照着改一定踩"的坑。
        - name: 部署脚本与清单门禁
          # 用自带 shellcheck 的镜像，避免每次流水线 apk add 重复安装系统依赖。
          # ⚠️ 选镜像的唯一硬约束是「镜像里必须有 /bin/sh」—— 平台用 `sh -c <script>`
          # 起 stage，镜像少了解释器就会在起容器阶段直接红，
          # 表现为：exec: "sh": executable file not found in $PATH（返回码 127）。
          #
          # 本轮红灯（cnb-26g-1k2vjn1he-002）就是踩了这个：
          # 上一轮把 koalaman/shellcheck-alpine（无 bash，`sh: bash: not found` 127）
          # 换成 koalaman/shellcheck:stable，以为 Debian 底必然规整，实际该镜像
          # **只有 /bin/bash 一个解释器，没有 /bin/sh，也没有 /usr/bin/env**
          # （本地 `tar -tf` 与 CNB 实测一致）；于是连 stage 脚本第一行都没跑到，
          # 容器就起不来 —— 日志只有 docker: OCI runtime create failed ... exec: "sh"。
          #
          # 结论：**不要**依赖任何第三方镜像的 shell 布局，用官方 node（Debian 底，
          # 自带 /bin/sh 与 bash）自己装 shellcheck 二进制。node:24 是官方镜像、
          # 自带 sh/bash/curl/tar，且与本仓库其它 stage 用的是同一个 tag，可复用层。
          image: node:24
          script: |
            set -e
            # shellcheck 用官方静态 tar 包，避免 apt/apk 装依赖污染镜像层；
            # 版本钉死，保证门禁结果在不同时间点可复现。
            # 当前 linux 静态包的最新稳定版就是 v0.10.0（不存在 v0.11/v0.12 这类
            # 版本号，写错会 404）；npm 的 `shellcheck` 包是另一套版本号（latest 4.x），
            # 所以 npm 兜底**不带版本**，交给其 dist-tags 决定。
            SHELLCHECK_VERSION=v0.10.0
            # 解释器自证：平台用 `sh -c` 起 stage，缺 sh 会连脚本都跑不到（见上方注释）。
            command -v sh >/dev/null \
              || { echo "镜像缺少 sh，无法执行 stage 脚本"; exit 1; }
            test -f /tmp/sc-dl-ok || rm -rf /tmp/sc-dl
            if ! command -v shellcheck >/dev/null 2>&1; then
              echo "--- 安装 shellcheck $SHELLCHECK_VERSION"
              arch=$(uname -m)
              case "$arch" in
                x86_64|amd64) sc_arch=x86_64 ;;
                aarch64|arm64) sc_arch=aarch64 ;;
                *) echo "不支持的架构：$arch"; exit 1 ;;
              esac
              mkdir -p /tmp/sc-dl
              sc_ok=0
              if command -v curl >/dev/null 2>&1; then
                # alpine 的 curl 可能是无 HTTPS 后端的 busybox 版，失败即降级，
                # 不再静默产出空文件（上一轮 `curl -o` 在无依赖下会拿到空 tar 包）。
                if curl -fsSL --retry 3 -o /tmp/sc-dl/sc.tar.xz \
                     "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.$sc_arch.tar.xz" && \
                   [ -s /tmp/sc-dl/sc.tar.xz ]; then
                  # 解 tar.xz **不依赖 xz 命令**：node 镜像自带 python3，
                  # 用标准库 tarfile 读 lzma 即可（CI 镜像里连 xz 都没有，
                  # 用 `tar -xJ` 会 "Cannot exec: No such file or directory"）。
                  if command -v python3 >/dev/null 2>&1; then
                    python3 -c "import tarfile,sys; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" \
                      /tmp/sc-dl/sc.tar.xz /tmp/sc-dl && sc_ok=1
                  elif command -v xz >/dev/null 2>&1; then
                    tar -xJf /tmp/sc-dl/sc.tar.xz -C /tmp/sc-dl && sc_ok=1
                  elif command -v busybox >/dev/null 2>&1 && busybox --list 2>/dev/null | grep -qx unxz; then
                    busybox unxz -c /tmp/sc-dl/sc.tar.xz > /tmp/sc-dl/sc.tar \
                      && tar -xf /tmp/sc-dl/sc.tar -C /tmp/sc-dl && sc_ok=1
                  else
                    echo "无可用解压器（python3/xz/busybox unxz），跳过 tar.xz 通道"
                  fi
                else
                  echo "curl 下载 shellcheck 失败，尝试 npm 兜底"
                fi
              fi
              if [ "$sc_ok" -ne 1 ] && command -v npm >/dev/null 2>&1; then
                # npm 上的 shellcheck 是"下载器"包，版本号与上游 release 不同步，
                # 因此这里不钉版本，由它的 latest tag 决定（仍会拉到同源二进制）。
                echo "--- npm 安装 shellcheck（备选源）"
                npm i -g shellcheck --no-audit --no-fund && sc_ok=1
              fi
              [ "$sc_ok" -eq 1 ] \
                || { echo "shellcheck 安装失败（github 与 npm 均不可用）"; exit 1; }
              if [ -x "/tmp/sc-dl/shellcheck-$SHELLCHECK_VERSION/shellcheck" ]; then
                install -m 0755 "/tmp/sc-dl/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
              fi
              rm -rf /tmp/sc-dl
              touch /tmp/sc-dl-ok
            fi
            shellcheck --version | head -3
            # 仍显式自证 bash 存在：本 stage 要跑 `bash -n` 与 `bash deploy/check_manifest.sh`
            # （check_manifest.sh 用了 pipefail 与 <(...) 进程替换，非 bash 不可）。
            command -v bash >/dev/null \
              || { echo "镜像缺少 bash，无法执行 bash -n / check_manifest.sh"; exit 1; }
            for f in deploy/backup.sh deploy/restore.sh deploy/check_manifest.sh deploy.sh ops/one_click_migrate.sh; do
              echo "--- bash -n $f"
              bash -n "$f"
              if command -v shellcheck >/dev/null 2>&1; then
                echo "--- shellcheck $f"
                # 只看 warning 及以上：ops/one_click_migrate.sh 有若干历史 info
                # 级提示（SC2015/SC2016），不属本批范围，不该卡住部署门禁；
                # 真正的 warning/error 仍然会红。
                shellcheck --severity=warning "$f"
              fi
            done

            # 部署清单与 Dockerfile.web 必须一致（否则静默漏文件）。
            echo "--- 部署清单一致性"
            bash deploy/check_manifest.sh

            # 防回退：Dockerfile.entrypoint 不得再 COPY 仓库里不存在的
            # backend/dist/migrate-docker（#9 的根因）。必须由构建阶段现编。
            # 只匹配真正的 COPY 指令，注释里提到该路径不算违规。
            echo "--- 一键部署构建可行性断言"
            if grep -E '^[[:space:]]*COPY[[:space:]]+backend/dist/migrate-docker' deploy/docker/Dockerfile.entrypoint; then
              echo "Dockerfile.entrypoint 仍依赖不存在的 backend/dist/migrate-docker，docker build 必失败"
              exit 1
            fi
            grep -Eq 'go build .* -o /out/migrate ./cmd/migrate' deploy/docker/Dockerfile.entrypoint \
              || { echo "Dockerfile.entrypoint 缺少 migrate 构建阶段"; exit 1; }

            # .dockerignore 必须存在（#61：防止把本机真配置烤进镜像）。
            echo "--- .dockerignore 存在性"
            test -f .dockerignore || { echo "缺少根 .dockerignore"; exit 1; }
            test -f backend/.dockerignore || { echo "缺少 backend/.dockerignore"; exit 1; }

            # 演练环境依赖断言：「备份→恢复演练」镜像必须装对包且装全。
            # Alpine 的 mysql-client 只给 `mysql`，不含 `mysqldump`（该 stage 第一次
            # 真跑就因此红了）；演练改为容器内直起 mysqld 后还需要服务端包。
            # 这条静态断言把同类改动拦在更前面，不必等下一次真跑。
            echo "--- 演练环境依赖断言"
            drill_dockerfile='deploy/docker/drill/Dockerfile'
            grep -q 'mariadb-client' "$drill_dockerfile" \
              || { echo "$drill_dockerfile 必须安装 mariadb-client（mysql-client 不含 mysqldump）"; exit 1; }
            if grep -E '^[[:space:]]*RUN[^#]*apk add[^#]*mysql-client' "$drill_dockerfile"; then
              echo "$drill_dockerfile 使用了 mysql-client：Alpine 下不含 mysqldump，backup.sh 必失败"
              exit 1
            fi
            grep -Eq '^[[:space:]]*RUN[^#]*apk add[^#]* mariadb([[:space:]\\]|$)' "$drill_dockerfile" \
              || { echo "$drill_dockerfile 必须安装 mariadb 服务端（演练要在容器内直起 mysqld）"; exit 1; }
            for bin in mysqldump mysqld mariadb-install-db mysql mysqladmin; do
              grep -q "command -v $bin" "$drill_dockerfile" \
                || { echo "$drill_dockerfile 缺少 $bin 的构建期预检（command -v $bin）"; exit 1; }
            done

            # 跨平台 find 断言：backup.sh / restore.sh 会在 Alpine(busybox) 与
            # Debian(GNU) 两种 find 下跑 —— 演练 stage 用 drill 镜像（Alpine），
            # 生产容器同样是 Alpine。busybox find **不支持 GNU 专属的 -printf**，
            # 用了会 "find: unrecognized: -printf" 非 0 退出；脚本里那句
            # 2>/dev/null 又把报错吞了，于是备份明明成功却静默收尾失败
            # （CI「备份→恢复演练」stage 的真实失败根因）。
            # 统一用 `-exec stat -c '%Y %n' {} +`：GNU/busybox 语义一致。
            echo "--- 跨平台 find 兼容性断言（禁止 GNU 专属 -printf）"
            for f in deploy/backup.sh deploy/restore.sh; do
              if grep -nE '(^|[^-[:alnum:]])-printf([[:space:]=]|$)' "$f" \
                   | grep -vE '^[0-9]+:[[:space:]]*#'; then
                echo "$f 使用了 GNU 专属的 find -printf：busybox find 不认，Alpine 下必失败"
                echo "（改用 -exec stat -c '%Y %n' {} +）"
                exit 1
              fi
            done
            echo "部署门禁通过"

        # --- 前端：单测 + 构建 -----------------------------------------------
        # npm run build 内含 vue-tsc --noEmit，因此这一阶段同时覆盖类型检查。
        - name: 前端单测与构建
          image: node:24
          script: |
            set -e
            cd frontend
            npm ci --no-audit --no-fund
            npm test
            npm run build

# 直接推送到 master（含合入后的结果）也要跑测试门禁：
# PR 门禁只覆盖「提 PR 的路径」，直接 push 或合并后的 master 需要一个兜底，
# 否则红灯仍然可能只存在于 master 而无人知晓。
master:
  push:
    - name: test-gate
      runner:
        cpus: 4
      # 备份→恢复演练要跑真 MySQL：用假数据或纯静态检查都不足以证明"备份能恢复"，
      # 那正是本批要修的东西。MySQL 直接在 stage 容器内起（见该 stage 说明），
      # 否则脚本连不上 127.0.0.1:3306；services: docker 仍然需要，因为 drill 镜像
      # 是 docker CLI 镜像，且构建环境声明在 docker.build 下。
      services:
        - docker
      # 流水线级默认构建环境 = drill 镜像（docker CLI + bash/gzip + mysql 服务端/客户端）。
      # 只有「备份→恢复演练」stage 用默认环境；其余 stage 各自声明 image 覆盖。
      # 必须放在 pipeline 级：Stage 不支持 docker.build，只有 image。
      docker:
        build:
          dockerfile: deploy/docker/drill/Dockerfile
      stages:
        - name: Go 编译与单测
          image: golang:1.26
          script: |
            set -e
            go version
            cd backend
            go vet ./...
            go build ./...
            go test ./...

        # PHP lint 用 8.2 对齐运行时（#60，理由见 PR 分支同名 stage）。
        - name: PHP 语法检查
          image: php:8.2-cli
          script: |
            set -e
            php -v
            fail=0
            # 逐个文件校验；find 排除依赖与产物目录，避免检查第三方代码。
            # 注意：CNB 阶段脚本默认由 /bin/sh(dash) 执行，不能用 <(...) 这类
            # bash 专有进程替换（会报 Syntax error: redirection unexpected，
            # 返回码 2，导致后续阶段全部跳过）。因此先把文件列表写入临时文件，
            # 再用普通重定向逐行读取。
            files=$(mktemp)
            find . -name '*.php' \
              -not -path './node_modules/*' \
              -not -path './frontend/node_modules/*' \
              -not -path './vendor/*' > "$files"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if ! out=$(php -l "$f" 2>&1); then
                echo "$out"
                fail=1
              fi
            done < "$files"
            rm -f "$files"
            if [ "$fail" -ne 0 ]; then
              echo "PHP 语法检查失败"
              exit 1
            fi
            echo "PHP 语法检查通过"

        # --- 安全配置断言 -----------------------------------------------------
        # XFF 必须使用覆盖式赋值。追加式（$proxy_add_x_forwarded_for）会把
        # 客户端自带的 X-Forwarded-For 带进后端，访客可据此伪造来源 IP，
        # 绕过限流与登录锁定、污染地域统计。这类配置错误不会让任何测试变红，
        # 只能靠一条 grep 守住；注释里的说明不算违规，所以只看赋值行。
        - name: 反代 XFF 赋值方式检查
          image: alpine:3.20
          script: |
            set -e
            hits=$(grep -rInE '^[[:space:]]*proxy_set_header[[:space:]]+X-Forwarded-For[[:space:]]+\$proxy_add_x_forwarded_for' --include='*.conf' --include='*.yml' --include='*.yaml' --exclude-dir=node_modules . || true)
            if [ -n "$hits" ]; then
              echo "发现追加式 X-Forwarded-For 赋值（可被伪造 IP）："
              echo "$hits"
              echo "请改为：proxy_set_header X-Forwarded-For \$remote_addr;"
              exit 1
            fi
            echo "XFF 赋值方式检查通过"
        # --- 备份→恢复演练（真 MySQL，端到端）---------------------------------
        # 这是本批唯一"不是静态检查"的门禁，也是最该有的一条：备份的价值只由
        # "能恢复"定义，而"能恢复"只有把 dump 真的导进一个库才知道。在本 stage
        # 容器内直接启动一个真 mysqld，跑 deploy/backup.sh 出 dump，再跑
        # deploy/restore.sh --check 导入临时库比对表数量 —— 失败即说明备份链路坏了。
        - name: 备份→恢复演练
          # 注意：这里**不能**写 stage/job 级的 docker.build —— Stage 只支持 image，
          # job 级的 docker 键会被静默忽略（平台校验器也不报错），于是本 stage 会退回
          # 默认构建环境 cnbcool/default-build-env，那里没有 mysqldump，backup.sh 直接
          # "mysqldump: command not found"（PR #48 首次真跑就踩了这个静默坑）。
          # 正确做法：把 drill 镜像声明在 **pipeline 级** docker.build（见本流水线头部），
          # 本 stage 不写 image，即继承该默认环境；其它 stage 各自用 image 覆盖。
          script: |
            set -e
            # 运行期预检：镜像里必须同时有 mysqld 与 mysqldump。CNB 以 dockerfile 声明
            # 构建环境时按内容缓存镜像，缓存命中就沿用旧层 —— 依赖包改了、镜像没跟着
            # 更新时，backup.sh 只会抛一句没头没尾的 "command not found"。这里先自证
            # 环境，缺什么直接红并打印诊断（DRILL_ENV_REV 已 +1 表示依赖变更）。
            echo "--- 演练环境自检"
            for bin in mysql mysqladmin mysqldump mysqld mariadb-install-db gzip bash; do
              if ! command -v "$bin" >/dev/null 2>&1; then
                echo "演练环境缺少 $bin：镜像未按 deploy/docker/drill/Dockerfile 重建"
                echo "（该镜像被缓存时不会自动跟着 Dockerfile 变化重建；确认 DRILL_ENV_REV 已 +1）"
                exit 1
              fi
            done
            mysql --version
            mysqld --version
            echo "演练环境自检通过"

            # 这里**不通过容器跑 MySQL，也不做任何端口映射/容器名解析**，
            # 而是在本 stage 容器内直接起一个 mysqld —— 因为备份/恢复脚本就在
            # 这个容器里执行，连 127.0.0.1:3306 必须由它自己监听。
            #
            # 为什么会走到这一步（三轮 CI 实测结论，别再回退成容器方案）：
            #   1) `-p 33061:3306` + 从容器连 127.0.0.1:33061 → 2002 (115 EINPROGRESS)；
            #   2) 改用 `--network host`（容器内 127.0.0.1:3306 可达）后，
            #      stage 容器**不是** host netns（CNB 构建容器有自己的 netns），
            #      它看到的 127.0.0.1 是它自己，所以仍然连不上。
            # 一句话：MySQL 在别的 netns 里，"连 127.0.0.1 由谁监听"就对不上。
            # 容器内直起 mysqld 则天然满足脚本的连接方式，也不再需要 docker-in-docker
            # 拉 mysql 镜像（少一次 ~25s 的镜像拉取）。
            # 说明：这与生产部署方式无关（生产是 docker compose），只是把 MySQL 放在
            # 与脚本同一个 netns 里，保证演练测的是备份/恢复链路本身。
            echo "=== 启动 MySQL（stage 容器内）"
            mkdir -p /run/mysqld /var/lib/mysql /tmp/mysql-logs
            chown -R mysql:mysql /run/mysqld /var/lib/mysql /tmp/mysql-logs
            # root@127.0.0.1 需要 TCP 登录（--protocol=TCP 走的就是 TCP，不走 socket）。
            # 只创建 root@localhost 会得到 "Access denied for user 'root'@'127.0.0.1'"。
            mysql_create_root() {
              mysql --socket=/run/mysqld/mysqld.sock -uroot -e "
                CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'drillroot';
                GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
                ALTER USER 'root'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('drillroot');
                FLUSH PRIVILEGES;"
            }
            # 初始化数据目录。必须按**服务端 flavor** 分流：
            #   - MariaDB（Alpine 的 `mariadb` 包，本镜像就是它）**没有**
            #     `--initialize-insecure` —— 那是 MySQL 8 专属参数，用了会
            #     "unknown option '--initialize-insecure'" 后立即 Abort
            #     （实测该 stage 0.4s 红）。MariaDB 用 `mariadb-install-db`。
            #   - MySQL 才用 `--initialize-insecure`。
            # 判据取 `mysqld --version` 的实际输出，不再靠"包名想当然"。
            init_datadir() {
              [ -d /var/lib/mysql/mysql ] && return 0
              echo "初始化数据目录（约 20-30s）..."
              if mysqld --version 2>&1 | grep -qi 'mariadb'; then
                echo "检测到 MariaDB 服务端，使用 mariadb-install-db"
                mariadb-install-db --user=mysql --datadir=/var/lib/mysql --skip-test-db >/dev/null
              else
                echo "检测到 MySQL 服务端，使用 --initialize-insecure"
                mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql
              fi
            }

            init_datadir
            # ⚠️ Alpine 的 mariadb 包在 /etc/my.cnf.d/mariadb-server.cnf 里**默认写死
            # \`skip-networking\`**（Alpine aports main/mariadb/APKBUILD 里可查）——
            # 于是 mysqld 只开 unix socket，TCP 完全不监听。日志里表现为
            # "ready for connections ... port: 0"，而 socket ping 却是通的：
            # 第 6 轮 CI 就是这样 —— 初始化过了、socket 就绪了，宿主侧 TCP 自检
            # 却连不上 127.0.0.1:3306，白白耗掉 60s 才失败。
            # 命令行显式 \`--skip-networking=0\` 覆盖配置文件里的开关，强制开 TCP。
            nohup mysqld --skip-networking=0 --user=mysql --datadir=/var/lib/mysql \
              --socket=/run/mysqld/mysqld.sock --port=3306 --bind-address=127.0.0.1 \
              --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci \
              >/tmp/mysql-logs/mysqld.log 2>&1 &
            echo "等待 MySQL 就绪..."
            READY=0
            for i in $(seq 1 60); do
              if mysqladmin --socket=/run/mysqld/mysqld.sock -uroot ping >/dev/null 2>&1; then echo "就绪(${i}s)"; READY=1; break; fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo "MySQL 未能在 120s 内就绪"
              tail -n 50 /tmp/mysql-logs/mysqld.log
              exit 1
            fi
            # TCP 端口自证：socket 通了**不代表** TCP 在听。Alpine 的 mariadb 默认
            # 带了 skip-networking，socket ping 照样 OK 但 TCP 是 0 端口。这里直接
            # 断言端口已监听，把问题定位到"没开 TCP"这一层，而不是拖到 60s 超时后
            # 只留一句"宿主侧连不上 127.0.0.1:3306"。
            if ! grep -qiE 'port:[[:space:]]*3306' /tmp/mysql-logs/mysqld.log; then
              echo "mysqld 未监听 TCP 3306（日志无 'port: 3306'，多半是被 skip-networking 关了）"
              grep -iE 'port:|networking' /tmp/mysql-logs/mysqld.log | tail -5
              exit 1
            fi
            mysql_create_root

            # 自证连通性：**宿主侧进程**（backup.sh/restore.sh 所处位置）用 TCP 直连。
            # 这条断言把"服务端起来了"与"脚本真的连得上"分开 —— 前两轮 CI 的失败
            # 都是两者不一致，却拖到 backup.sh 才以一句 2002 暴露。
            echo "--- 宿主到 MySQL 连通性自检"
            for i in $(seq 1 30); do
              if MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP -N -B -e 'SELECT 1' >/dev/null 2>&1; then
                echo "宿主侧连通 OK（127.0.0.1:3306）"; break
              fi
              if [ "$i" -eq 30 ]; then
                echo "宿主侧连不上 127.0.0.1:3306"
                tail -n 50 /tmp/mysql-logs/mysqld.log
                exit 1
              fi
              sleep 2
            done

            # 建两个库并灌入真实 schema（用仓库里的迁移文件，不用假数据）。
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP -e "CREATE DATABASE dwz_admin CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE dwz_public CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP dwz_admin < backend/migrations/schema.sql
            MYSQL_PWD=drillroot mysql -h127.0.0.1 -P3306 -uroot --protocol=TCP dwz_public < backend/migrations/php/add_webhook_queue.sql

            export DB_HOST=127.0.0.1 DB_PORT=3306
            export DB_ADMIN_USER=root DB_ADMIN_PASS=drillroot DB_ADMIN_NAME=dwz_admin
            export DB_PUBLIC_USER=root DB_PUBLIC_PASS=drillroot DB_PUBLIC_NAME=dwz_public
            export BACKUP_DIR=/tmp/dwz-backups
            mkdir -p "$BACKUP_DIR"

            echo "--- 备份"
            # 显式断言备份成功且真的产出了两份非空 dump。
            # #55 教训：backup.sh 历史上会把失败当成功返回 0，只靠 "脚本没报错"
            # 判定备份成功等于没验；这里用产物存在性做二次兜底。
            #
            # ⚠️ 第 7 轮真跑曾在这里"两库都备份成功、然后没有然后了"并返回 1：
            # backup.sh 末尾的备份轮转用了 GNU 专属的 `find -printf`，而本 stage 的
            # drill 镜像是 **Alpine**，busybox `find` 不认 `-printf` → 非 0 退出，
            # 报错又被脚本里的 2>/dev/null 吞掉。已改为 `find … -exec stat -c '%Y %n' {} +`
            # （GNU/busybox 语义一致），并在部署门禁加了禁止 `-printf` 的静态断言。
            # 所以：**本 stage 的脚本必须同时兼容 GNU 与 busybox 工具链**。
            bash deploy/backup.sh
            ls -la "$BACKUP_DIR"
            for f in "$BACKUP_DIR"/dwz_admin-*.sql.gz "$BACKUP_DIR"/dwz_public-*.sql.gz; do
              [ -s "$f" ] || { echo "备份产物缺失或为空：$f"; exit 1; }
              gzip -t "$f" || { echo "备份产物 gzip 校验失败：$f"; exit 1; }
            done
            echo "备份成功：两份 dump 均非空且 gzip 合法"

            echo "--- 恢复演练（必须 PASS）"
            bash deploy/restore.sh --check

            echo "--- 残档防护 A：显式指定截断的 dump 必须被拒（非 0 退出）"
            printf 'CREATE TABLE t(id int);\n' | gzip -9 > /tmp/truncated.sql.gz
            if bash deploy/restore.sh --admin-only --check --file=/tmp/truncated.sql.gz 2>/dev/null; then
              echo "截断的 dump 被当成有效备份 -> 失败"; exit 1
            fi
            echo "截断 dump 已被正确拒绝"

            echo "--- 残档防护 B：目录里最新的 dump 是残档时，必须跳过它用完整的那个"
            # 造一个 mtime 最新的截断残档，放在与完整 dump 同一个目录。
            cp /tmp/truncated.sql.gz "$BACKUP_DIR/dwz_admin-20990101-000000.sql.gz"
            touch "$BACKUP_DIR/dwz_admin-20990101-000000.sql.gz"
            bash deploy/restore.sh --admin-only --check
            echo "残档已被跳过，演练用的是完整 dump"

      # --- 部署脚本与清单门禁（#16 / #55 / #61）-------------------------------
      # 部署相关的问题不会让任何单测变红：#9 那种"COPY 一个不存在的文件"
      # 只有真 docker build 才会暴露；#16 的清单漂移只有对比两份列表才知道。
      # 这里用 shellcheck + bash -n + 清单一致性 + 关键 COPY 存在性做静态门禁，
      # 在不引入 docker-in-docker 的前提下覆盖住"照着改一定踩"的坑。
        - name: 部署脚本与清单门禁
          # 用自带 shellcheck 的镜像，避免每次流水线 apk add 重复安装系统依赖。
          # ⚠️ 选镜像的唯一硬约束是「镜像里必须有 /bin/sh」—— 平台用 `sh -c <script>`
          # 起 stage，镜像少了解释器就会在起容器阶段直接红，
          # 表现为：exec: "sh": executable file not found in $PATH（返回码 127）。
          #
          # 本轮红灯（cnb-26g-1k2vjn1he-002）就是踩了这个：
          # 上一轮把 koalaman/shellcheck-alpine（无 bash，`sh: bash: not found` 127）
          # 换成 koalaman/shellcheck:stable，以为 Debian 底必然规整，实际该镜像
          # **只有 /bin/bash 一个解释器，没有 /bin/sh，也没有 /usr/bin/env**
          # （本地 `tar -tf` 与 CNB 实测一致）；于是连 stage 脚本第一行都没跑到，
          # 容器就起不来 —— 日志只有 docker: OCI runtime create failed ... exec: "sh"。
          #
          # 结论：**不要**依赖任何第三方镜像的 shell 布局，用官方 node（Debian 底，
          # 自带 /bin/sh 与 bash）自己装 shellcheck 二进制。node:24 是官方镜像、
          # 自带 sh/bash/curl/tar，且与本仓库其它 stage 用的是同一个 tag，可复用层。
          image: node:24
          script: |
            set -e
            # shellcheck 用官方静态 tar 包，避免 apt/apk 装依赖污染镜像层；
            # 版本钉死，保证门禁结果在不同时间点可复现。
            # 当前 linux 静态包的最新稳定版就是 v0.10.0（不存在 v0.11/v0.12 这类
            # 版本号，写错会 404）；npm 的 `shellcheck` 包是另一套版本号（latest 4.x），
            # 所以 npm 兜底**不带版本**，交给其 dist-tags 决定。
            SHELLCHECK_VERSION=v0.10.0
            # 解释器自证：平台用 `sh -c` 起 stage，缺 sh 会连脚本都跑不到（见上方注释）。
            command -v sh >/dev/null \
              || { echo "镜像缺少 sh，无法执行 stage 脚本"; exit 1; }
            test -f /tmp/sc-dl-ok || rm -rf /tmp/sc-dl
            if ! command -v shellcheck >/dev/null 2>&1; then
              echo "--- 安装 shellcheck $SHELLCHECK_VERSION"
              arch=$(uname -m)
              case "$arch" in
                x86_64|amd64) sc_arch=x86_64 ;;
                aarch64|arm64) sc_arch=aarch64 ;;
                *) echo "不支持的架构：$arch"; exit 1 ;;
              esac
              mkdir -p /tmp/sc-dl
              sc_ok=0
              if command -v curl >/dev/null 2>&1; then
                # alpine 的 curl 可能是无 HTTPS 后端的 busybox 版，失败即降级，
                # 不再静默产出空文件（上一轮 `curl -o` 在无依赖下会拿到空 tar 包）。
                if curl -fsSL --retry 3 -o /tmp/sc-dl/sc.tar.xz \
                     "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.$sc_arch.tar.xz" && \
                   [ -s /tmp/sc-dl/sc.tar.xz ]; then
                  # 解 tar.xz **不依赖 xz 命令**：node 镜像自带 python3，
                  # 用标准库 tarfile 读 lzma 即可（CI 镜像里连 xz 都没有，
                  # 用 `tar -xJ` 会 "Cannot exec: No such file or directory"）。
                  if command -v python3 >/dev/null 2>&1; then
                    python3 -c "import tarfile,sys; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" \
                      /tmp/sc-dl/sc.tar.xz /tmp/sc-dl && sc_ok=1
                  elif command -v xz >/dev/null 2>&1; then
                    tar -xJf /tmp/sc-dl/sc.tar.xz -C /tmp/sc-dl && sc_ok=1
                  elif command -v busybox >/dev/null 2>&1 && busybox --list 2>/dev/null | grep -qx unxz; then
                    busybox unxz -c /tmp/sc-dl/sc.tar.xz > /tmp/sc-dl/sc.tar \
                      && tar -xf /tmp/sc-dl/sc.tar -C /tmp/sc-dl && sc_ok=1
                  else
                    echo "无可用解压器（python3/xz/busybox unxz），跳过 tar.xz 通道"
                  fi
                else
                  echo "curl 下载 shellcheck 失败，尝试 npm 兜底"
                fi
              fi
              if [ "$sc_ok" -ne 1 ] && command -v npm >/dev/null 2>&1; then
                # npm 上的 shellcheck 是"下载器"包，版本号与上游 release 不同步，
                # 因此这里不钉版本，由它的 latest tag 决定（仍会拉到同源二进制）。
                echo "--- npm 安装 shellcheck（备选源）"
                npm i -g shellcheck --no-audit --no-fund && sc_ok=1
              fi
              [ "$sc_ok" -eq 1 ] \
                || { echo "shellcheck 安装失败（github 与 npm 均不可用）"; exit 1; }
              if [ -x "/tmp/sc-dl/shellcheck-$SHELLCHECK_VERSION/shellcheck" ]; then
                install -m 0755 "/tmp/sc-dl/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
              fi
              rm -rf /tmp/sc-dl
              touch /tmp/sc-dl-ok
            fi
            shellcheck --version | head -3
            # 仍显式自证 bash 存在：本 stage 要跑 `bash -n` 与 `bash deploy/check_manifest.sh`
            # （check_manifest.sh 用了 pipefail 与 <(...) 进程替换，非 bash 不可）。
            command -v bash >/dev/null \
              || { echo "镜像缺少 bash，无法执行 bash -n / check_manifest.sh"; exit 1; }
            for f in deploy/backup.sh deploy/restore.sh deploy/check_manifest.sh deploy.sh ops/one_click_migrate.sh; do
              echo "--- bash -n $f"
              bash -n "$f"
              if command -v shellcheck >/dev/null 2>&1; then
                echo "--- shellcheck $f"
                # 只看 warning 及以上：ops/one_click_migrate.sh 有若干历史 info
                # 级提示（SC2015/SC2016），不属本批范围，不该卡住部署门禁；
                # 真正的 warning/error 仍然会红。
                shellcheck --severity=warning "$f"
              fi
            done

            # 部署清单与 Dockerfile.web 必须一致（否则静默漏文件）。
            echo "--- 部署清单一致性"
            bash deploy/check_manifest.sh

            # 防回退：Dockerfile.entrypoint 不得再 COPY 仓库里不存在的
            # backend/dist/migrate-docker（#9 的根因）。必须由构建阶段现编。
            # 只匹配真正的 COPY 指令，注释里提到该路径不算违规。
            echo "--- 一键部署构建可行性断言"
            if grep -E '^[[:space:]]*COPY[[:space:]]+backend/dist/migrate-docker' deploy/docker/Dockerfile.entrypoint; then
              echo "Dockerfile.entrypoint 仍依赖不存在的 backend/dist/migrate-docker，docker build 必失败"
              exit 1
            fi
            grep -Eq 'go build .* -o /out/migrate ./cmd/migrate' deploy/docker/Dockerfile.entrypoint \
              || { echo "Dockerfile.entrypoint 缺少 migrate 构建阶段"; exit 1; }

            # .dockerignore 必须存在（#61：防止把本机真配置烤进镜像）。
            echo "--- .dockerignore 存在性"
            test -f .dockerignore || { echo "缺少根 .dockerignore"; exit 1; }
            test -f backend/.dockerignore || { echo "缺少 backend/.dockerignore"; exit 1; }

            # 演练环境依赖断言：「备份→恢复演练」镜像必须装对包且装全。
            # Alpine 的 mysql-client 只给 `mysql`，不含 `mysqldump`（该 stage 第一次
            # 真跑就因此红了）；演练改为容器内直起 mysqld 后还需要服务端包。
            # 这条静态断言把同类改动拦在更前面，不必等下一次真跑。
            echo "--- 演练环境依赖断言"
            drill_dockerfile='deploy/docker/drill/Dockerfile'
            grep -q 'mariadb-client' "$drill_dockerfile" \
              || { echo "$drill_dockerfile 必须安装 mariadb-client（mysql-client 不含 mysqldump）"; exit 1; }
            if grep -E '^[[:space:]]*RUN[^#]*apk add[^#]*mysql-client' "$drill_dockerfile"; then
              echo "$drill_dockerfile 使用了 mysql-client：Alpine 下不含 mysqldump，backup.sh 必失败"
              exit 1
            fi
            grep -Eq '^[[:space:]]*RUN[^#]*apk add[^#]* mariadb([[:space:]\\]|$)' "$drill_dockerfile" \
              || { echo "$drill_dockerfile 必须安装 mariadb 服务端（演练要在容器内直起 mysqld）"; exit 1; }
            for bin in mysqldump mysqld mariadb-install-db mysql mysqladmin; do
              grep -q "command -v $bin" "$drill_dockerfile" \
                || { echo "$drill_dockerfile 缺少 $bin 的构建期预检（command -v $bin）"; exit 1; }
            done

            # 跨平台 find 断言：backup.sh / restore.sh 会在 Alpine(busybox) 与
            # Debian(GNU) 两种 find 下跑 —— 演练 stage 用 drill 镜像（Alpine），
            # 生产容器同样是 Alpine。busybox find **不支持 GNU 专属的 -printf**，
            # 用了会 "find: unrecognized: -printf" 非 0 退出；脚本里那句
            # 2>/dev/null 又把报错吞了，于是备份明明成功却静默收尾失败
            # （CI「备份→恢复演练」stage 的真实失败根因）。
            # 统一用 `-exec stat -c '%Y %n' {} +`：GNU/busybox 语义一致。
            echo "--- 跨平台 find 兼容性断言（禁止 GNU 专属 -printf）"
            for f in deploy/backup.sh deploy/restore.sh; do
              if grep -nE '(^|[^-[:alnum:]])-printf([[:space:]=]|$)' "$f" \
                   | grep -vE '^[0-9]+:[[:space:]]*#'; then
                echo "$f 使用了 GNU 专属的 find -printf：busybox find 不认，Alpine 下必失败"
                echo "（改用 -exec stat -c '%Y %n' {} +）"
                exit 1
              fi
            done
            echo "部署门禁通过"

        # --- 前端：单测 + 构建 -----------------------------------------------
        # npm run build 内含 vue-tsc --noEmit，因此这一阶段同时覆盖类型检查。
        - name: 前端单测与构建
          image: node:24
          script: |
            set -e
            cd frontend
            npm ci --no-audit --no-fund
            npm test
            npm run build
