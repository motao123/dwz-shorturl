              echo "$hits"
              echo "请改为：proxy_set_header X-Forwarded-For \$remote_addr;"
              exit 1
            fi
            echo "XFF 赋值方式检查通过"
        # --- 前端：单测 + 构建 -----------------------------------------------
        # npm run build 内含 vue-tsc --noEmit，因此这一阶段同时覆盖类型检查。
        - name: 前端单测与构建
          image: node:24
          script: |
            set -e
            cd frontend
            npm ci --no-audit --no-fund
            npm test
            npm run build
