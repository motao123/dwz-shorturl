# ============================================================
# CNB 代码安全扫描 · 仓库级配置
#
# 平台默认即开启扫描，本文件只做「范围收敛」，不关闭任何能力。
#
# 背景：仓库安全页曾出现 31 条漏洞 / 10 条代码问题 / 7 条敏感信息，
#       其中绝大多数是「间接依赖版本区间命中」与「示例配置占位符
#       误命中」，属规则噪音。PR 阶段的新增风险拦截由 .cnb.yml 中的
#       SCA 插件负责（增量门禁），因此这里只负责降噪。
#
# 语法参考：https://docs.cnb.cool/zh/security/syntax-reference.md
# ============================================================

# 公共忽略规则见仓库根目录 .scanignore
software-composition-analysis:
  scan:
    paths:
      # 公共忽略规则之外，测试用依赖清单不参与 SCA 评估
      - "**/testdata/**"
      - "**/fixtures/**"
