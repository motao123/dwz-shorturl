# ============================================================
# dwz-shorturl nginx site examples
# Choose ONE server block: root deployment or subdirectory deployment.
# Adjust paths, names and fastcgi_pass, then run nginx -t.
# ============================================================

server {
    listen 80;
    server_name short.example.com;

    root /var/www/dwz-shorturl;
    index index.html index.php;

    access_log /var/log/nginx/dwz.access.log;
    error_log  /var/log/nginx/dwz.error.log warn;

    autoindex off;

    # Hidden files/directories, including .git and .env.
    location ~ (^|/)\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Internal directories must never be web-accessible. PHP includes are
    # covered here before the generic PHP handler.
    location ~ ^/(?:includes|migrations|logs)(?:/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Secrets, installers, schema/dump files and server examples.
    location ~* ^/(?:config(?:\.sample)?\.php|setup\.php|install\.sql|nginx\.example\.conf|composer\.(?:json|lock)|.*\.(?:log|sql|bak|old|orig|save|swp))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Execute only real PHP files under the configured document root.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock; # or 127.0.0.1:9000
    }

    # Sitemap: serve via PHP
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location / {
        try_files $uri $uri/ @short;
    }

    location @short {
        rewrite ^/([a-z0-5]{6,8})$ /do.php?uid=$1 last;
        return 404;
    }
}

# Concrete subdirectory deployment at https://example.com/short/
# Place the project at /var/www/html/short and use this separate server block.
server {
    listen 80;
    server_name example.com;
    root /var/www/html;
    index index.html index.php;
    autoindex off;

    location ~ ^/short/(?:includes|migrations|logs)(?:/|$) { deny all; }
    location ~* ^/short/(?:\.|config(?:\.sample)?\.php$|setup\.php$|install\.sql$|nginx\.example\.conf$|.*\.(?:log|sql|bak|old|orig|save|swp)$) { deny all; }

    location = /short { return 301 /short/; }
    location /short/ {
        try_files $uri $uri/ @short_subdir;
    }

    location ~ ^/short/(.+\.php)$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location @short_subdir {
        rewrite ^/short/([a-z0-5]{6,8})$ /short/do.php?uid=$1 last;
        return 404;
    }
}
