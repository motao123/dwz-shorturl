# ============================================================
# dwz-shorturl nginx site examples
# Choose ONE server block: root deployment or subdirectory deployment.
# Adjust paths, names and fastcgi_pass, then run nginx -t.
#
# 反向代理部署（本服务前面还有一层 nginx/负载均衡）注意事项：
#   1) 上游必须用覆盖式赋值：proxy_set_header X-Forwarded-For $remote_addr;
#      切勿使用 $proxy_add_x_forwarded_for，否则客户端可自行注入 XFF 绕过限流。
#   2) 本项目 config.php 的 $trusted_proxies 必须填写代理自身地址，
#      否则所有访客会被归并为同一个限流桶。
#   3) 跳转路径建议追加：add_header Referrer-Policy "no-referrer" always;
# ============================================================

server {
    listen 80;
    server_name short.example.com;

    root /var/www/dwz-shorturl;
    index index.php index.html;

    access_log /var/log/nginx/dwz.access.log;
    error_log  /var/log/nginx/dwz.error.log warn;

    autoindex off;

    # Baseline security headers. Short-link redirects additionally add
    # Referrer-Policy: no-referrer below so the destination never learns the
    # referring short URL.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hidden files/directories, including .git and .env.
    location ~ (^|/)\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Internal directories must never be web-accessible. PHP includes are
    # covered here before the generic PHP handler.
    location ~ ^/(?:includes|migrations|logs)(?:/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Secrets, installers, schema/dump files and server examples.
    location ~* ^/(?:config(?:\.sample)?\.php|setup\.php|install\.sql|nginx\.example\.conf|composer\.(?:json|lock)|.*\.(?:log|sql|bak|old|orig|save|swp))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Execute only real PHP files under the configured document root.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        # Pass Authorization through so stats.php Bearer tokens keep working
        # (fastcgi_params does not forward it by default).
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock; # or 127.0.0.1:9000
    }


    # ── Go 后端反代（非 Docker 部署必配）────────────────────────────
    # 管理台 /admin/api、会员中心 /member/api、对外 /public/api 与跳转网关
    # 均由 Go 后端提供。若缺少下面这些 location，管理台与会员中心的接口会全部
    # 404（域名池选不中、创建短链一直落在主域名），且前端不会有任何提示。
    #
    # 未使用 Go 后端（纯 PHP）时，把 upstream 与这三段 location 整段注释掉即可：
    # 前台 do.php / api.php / batch.php / member.php 仍然完全可用。
    #
    # upstream dwz_backend {
    #     server 127.0.0.1:8080;
    #     keepalive 32;
    # }

    location /admin/api/ {
        # proxy_pass http://dwz_backend;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # 覆盖式赋值，避免访客伪造 X-Forwarded-For 绕过限流
        # proxy_set_header X-Forwarded-For $remote_addr;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Connection "";
        # proxy_connect_timeout 10s;
        # proxy_read_timeout 60s;
        return 502;
    }

    location /member/api/ {
        # proxy_pass http://dwz_backend;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $remote_addr;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Connection "";
        # proxy_connect_timeout 10s;
        # proxy_read_timeout 60s;
        return 502;
    }

    location /public/api/ {
        # proxy_pass http://dwz_backend;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $remote_addr;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Connection "";
        # proxy_connect_timeout 10s;
        # proxy_read_timeout 60s;
        return 502;
    }

    location = /health {
        # proxy_pass http://dwz_backend/health;
        return 502;
    }

    # Sitemap: serve via PHP
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location / {
        try_files $uri $uri/ @short;
    }

    location @short {
        add_header Referrer-Policy "no-referrer" always;
        rewrite ^/([a-z0-5]{6,8})$ /do.php?uid=$1 last;
        return 404;
    }
}

# Concrete subdirectory deployment at https://example.com/short/
# Place the project at /var/www/html/short and use this separate server block.
server {
    listen 80;
    server_name example.com;
    root /var/www/html;
    index index.php index.html;
    autoindex off;

    location ~ ^/short/(?:includes|migrations|logs)(?:/|$) { deny all; }
    location ~* ^/short/(?:\.|config(?:\.sample)?\.php$|setup\.php$|install\.sql$|nginx\.example\.conf$|.*\.(?:log|sql|bak|old|orig|save|swp)$) { deny all; }

    location = /short { return 301 /short/; }
    location /short/ {
        try_files $uri $uri/ @short_subdir;
    }

    location ~ ^/short/(.+\.php)$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        # Pass Authorization through so stats.php Bearer tokens keep working
        # (fastcgi_params does not forward it by default).
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location @short_subdir {
        add_header Referrer-Policy "no-referrer" always;
        rewrite ^/short/([a-z0-5]{6,8})$ /short/do.php?uid=$1 last;
        return 404;
    }
}
