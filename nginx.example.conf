# ============================================================
# dwz-shorturl —— nginx 站点配置示例（替代 .htaccess，Apache 配置不适用于 nginx）
# 复制本文件到 /etc/nginx/conf.d/dwz.conf 或站点可用配置中，按需修改 root / server_name / fastcgi_pass
# ============================================================

server {
    listen 80;
    # 如有 HTTPS，自行加 listen 443 ssl; 与证书配置
    server_name short.example.com;   # ← 改成你的域名

    # ↓↓↓ 改成你实际部署的项目根目录（必须含 index.html）↓↓↓
    root /var/www/dwz-shorturl;
    index index.html index.php;

    # 访问日志 / 错误日志（403 排查看 error.log）
    access_log /var/log/nginx/dwz.access.log;
    error_log  /var/log/nginx/dwz.error.log warn;

    # 安全：禁止访问隐藏文件（含 .git / .htaccess / config.php 等敏感文件）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 静态资源
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP 请求交给 php-fpm（端口/ sock 按你环境改）
    location ~ \.php$ {
        # 下面这行是 403/404 的常见坑：必须存在 fastcgi 脚本文件才执行
        try_files $uri =404;
        fastcgi_pass   unix:/run/php/php-fpm.sock;   # 或 127.0.0.1:9000
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # ↓↓↓ 短链伪静态：把 /<短码> 重写到 do.php?uid=<短码>（等价于 .htaccess，nginx 专属）↓↓↓
    location / {
        try_files $uri $uri/ @short;
    }
    location @short {
        # 仅匹配 6-8 位 a-z0-5 的短码
        rewrite ^/([a-z0-5]{6,8})$ /do.php?uid=$1 last;
    }

    # setup.php 安装后强烈建议删除或限制 IP 访问
    location = /setup.php {
        # allow 127.0.0.1; deny all;   # 需要时放开，仅允许本机访问安装
        try_files $uri =404;
    }
}
