upstream backend_api {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Baseline security headers (inherited by proxied responses handled here).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Admin frontend (SPA)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin API proxy
    location /admin/api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Public short URL API (proxy to Go backend)
    location ~ ^/(api|batch)\.php$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public redirect (short codes)
    # $uri already carries the leading slash, so "r$uri" yields /r/<code>,
    # matching the Go backend route /r/:code.
    location ~ ^/[a-z0-5]{6,8}$ {
        proxy_pass http://backend_api/r$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # This server only serves the SPA and proxies to the Go backend: it must
    # never execute or expose PHP/backend sources. Without these rules a
    # mounted project root would leak config.php (DB credentials) as a static
    # file, because there is no PHP handler here.
    location ~* \.(?:php|phtml|phps|sql|log|env|ya?ml|bak|old|orig|save|swp|sh|md)$ {
        deny all;
        return 404;
    }

    location ~* ^/(?:includes|migrations|logs|deploy|backend|frontend|docs|site|tests?)(?:/|$) {
        deny all;
        return 404;
    }

    # Deny common credential files outright.
    location ~* /(?:config\.php|config\.sample\.php|setup\.php|install\.sql|composer\.(?:json|lock)|\.env(?:\..*)?)$ {
        deny all;
        return 404;
    }

    # Real health check: proxy to the backend, which reports DB/Redis state.
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
