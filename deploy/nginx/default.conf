# ============================================================
# ⚠️ 这是「手工裸机 / 非 docker」参考配置，不是任何构建的输入（#65）
#
# 谁在用哪份配置：
#   - docker compose 一键部署（推荐）→ deploy/docker/web/nginx.conf
#     （由 deploy/docker/Dockerfile.web COPY 进镜像，真实生效）
#   - 宝塔/裸机 → nginx.example.conf（仓库根）或按 docs/deploy-baota.md 手配
#
# 本文件全仓只被注释与文档引用，没有任何构建/部署流程加载它。之所以保留，
# 是因为它承载了 `/metrics` 内网白名单的写法示例；但请勿直接拿去用：
#   - 它把 /api.php、/batch.php 反代给 Go 后端，而 Go 没有这两条路由，必 404
#   - 它的 document root、PHP handler 均未与实际部署对齐
# 若你确实在裸机上用本文件，请逐条对照 nginx.example.conf 校正后再上线。
# ============================================================
upstream backend_api {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Baseline security headers (inherited by proxied responses handled here).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Admin frontend (SPA)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin API proxy
    location /admin/api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Public short URL API (proxy to Go backend)
    location ~ ^/(api|batch)\.php$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public redirect (short codes)
    # $uri already carries the leading slash, so "r$uri" yields /r/<code>,
    # matching the Go backend route /r/:code.
    location ~ ^/[a-z0-5]{6,8}$ {
        proxy_pass http://backend_api/r$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # This server only serves the SPA and proxies to the Go backend: it must
    # never execute or expose PHP/backend sources. Without these rules a
    # mounted project root would leak config.php (DB credentials) as a static
    # file, because there is no PHP handler here.
    location ~* \.(?:php|phtml|phps|sql|log|env|ya?ml|bak|old|orig|save|swp|sh|md)$ {
        deny all;
        return 404;
    }

    location ~* ^/(?:includes|migrations|logs|deploy|backend|frontend|docs|site|tests?)(?:/|$) {
        deny all;
        return 404;
    }

    # Deny common credential files outright.
    location ~* /(?:config\.php|config\.sample\.php|setup\.php|install\.sql|composer\.(?:json|lock)|\.env(?:\..*)?)$ {
        deny all;
        return 404;
    }

    # Real health check: proxy to the backend, which reports DB/Redis state.
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Prometheus 抓取端点。默认拒绝所有外部来源：指标会暴露连接数、队列深度
    # 等运维内部信息，不应随业务端口对外开放。只允许监控网段访问，按需改成
    # 自己 Prometheus 所在的地址/CIDR；本机抓取可放开 127.0.0.1。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 抓取是只读的，不需要把请求体或客户端信息透传下去。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
