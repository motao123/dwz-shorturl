version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dwz-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DWZ_SERVER_PORT=8080
      - DWZ_SERVER_MODE=release
      - DWZ_DATABASE_HOST=mysql
      - DWZ_DATABASE_PORT=3306
      - DWZ_DATABASE_USER=dwz
      - DWZ_DATABASE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
      - DWZ_DATABASE_DBNAME=dwz_admin
      - DWZ_PUBLIC_DB_HOST=mysql
      - DWZ_PUBLIC_DB_PORT=3306
      - DWZ_PUBLIC_DB_USER=dwz
      - DWZ_PUBLIC_DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
      - DWZ_PUBLIC_DB_DBNAME=1_xk7_cn
      - DWZ_REDIS_ADDR=redis:6379
      - DWZ_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
      - DWZ_JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须在 .env 中设置}
      - DWZ_JWT_ACCESS_EXPIRY=2h
      - DWZ_JWT_REFRESH_EXPIRY=168h
      - DWZ_PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://1.xk7.cn}
      - DWZ_LOG_LEVEL=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dwz-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dwz-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dwz-net

  mysql:
    image: mysql:8.0
    container_name: dwz-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      - MYSQL_DATABASE=dwz_admin
      - MYSQL_USER=dwz
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
    # 生产环境移除端口映射（仅容器网络互通）；本地调试可临时改为 127.0.0.1:3306:3306
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./scripts/init_public_db.sql:/docker-entrypoint-initdb.d/init_public_db.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dwz-net

  redis:
    image: redis:7-alpine
    container_name: dwz-redis
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dwz-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  dwz-net:
    driver: bridge
