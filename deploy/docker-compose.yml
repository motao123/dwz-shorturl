# ============================================================
# dwz-shorturl 分库部署（管理库 + 公共库分离）
#
# 与仓库根目录的 docker-compose.yml 是**两种不同模式**，不是新旧版本，
# 两者都在维护：
#   - 根目录 docker-compose.yml  → 单库模式，init 容器全自动，推荐绝大多数场景
#   - 本文件                     → 分库模式，适合已有独立两库 / 多站点共用公共库
# 选择依据见 README.md 的「单库 vs 分库」对照表。
#
# 用法：
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d
# ============================================================
version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dwz-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DWZ_SERVER_PORT=8080
      - DWZ_SERVER_MODE=release
      - DWZ_DATABASE_HOST=mysql
      - DWZ_DATABASE_PORT=3306
      - DWZ_DATABASE_USER=dwz
      - DWZ_DATABASE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
      - DWZ_DATABASE_DBNAME=dwz_admin
      - DWZ_PUBLIC_DB_HOST=mysql
      - DWZ_PUBLIC_DB_PORT=3306
      - DWZ_PUBLIC_DB_USER=dwz
      - DWZ_PUBLIC_DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
      - DWZ_PUBLIC_DB_DBNAME=1_xk7_cn
      - DWZ_REDIS_ADDR=redis:6379
      - DWZ_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
      - DWZ_JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须在 .env 中设置}
      - DWZ_JWT_ACCESS_EXPIRY=2h
      - DWZ_JWT_REFRESH_EXPIRY=168h
      - DWZ_PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://1.xk7.cn}
      - DWZ_LOG_LEVEL=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dwz-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dwz-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dwz-net

  mysql:
    image: mysql:8.0
    container_name: dwz-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在 .env 中设置}
      - MYSQL_DATABASE=dwz_admin
      - MYSQL_USER=dwz
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须在 .env 中设置}
    # 生产环境移除端口映射（仅容器网络互通）；本地调试可临时改为 127.0.0.1:3306:3306
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./scripts/init_public_db.sql:/docker-entrypoint-initdb.d/init_public_db.sql:ro
    # 内存调优：innodb-buffer-pool-size 建议按实例内存的 50%~70% 设置；
    # 小内存 VPS 上 256M 偏高，可按需下调（如 128M）。redis 侧同理。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M
    healthcheck:
      # B9：不再把 root 密码写进 healthcheck 命令行（原先会明文出现在
      # `docker inspect` 的 Test 字段与容器 ps 输出中）。改用 MYSQL_PWD 环境变量，
      # mysqladmin 会从该变量读取密码，命令行里不再出现明文。
      # MYSQL_ROOT_PASSWORD 已在服务级 environment 中注入，healthcheck 可直接引用。
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dwz-net

  redis:
    image: redis:7-alpine
    container_name: dwz-redis
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
    healthcheck:
      # B9：redis-cli 改从 REDISCLI_AUTH 读取密码，避免 -a 参数让密码出现在 ps 输出。
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dwz-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  dwz-net:
    driver: bridge
