[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 消费 webhook_queue 并投递 webhook 事件（#12）。
#
# 背景：PHP 跳转热路径（do.php / api.php / batch.php）只把事件 INSERT 进
# webhook_queue（O(1)，无网络），投递由本 worker 在后台完成。此前唯一的消费者
# 是 migrations/webhook_worker.php，但它既不在镜像里、supervisord 也没有该
# 程序、compose 也没有 worker 服务 —— 于是"配置了 webhook 却永远收不到通知"
# 且队列表单调膨胀。现在把它作为常驻进程跑在 web 容器内（与 PHP 同镜像、
# 同 config.php，最省事且不需要额外的 DB 权限）。
#
# --loop --interval=5：常驻模式，空队列时每 5 秒轮询一次；有任务时紧凑循环。
[program:webhook-worker]
command=php /var/www/dwz/migrations/webhook_worker.php --loop --interval=5 --batch=50
priority=30
autorestart=true
startretries=5
# 启动稍等 config.php 软链与迁移完成，避免一开始就因 admin DB 不可用而退出刷屏。
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
