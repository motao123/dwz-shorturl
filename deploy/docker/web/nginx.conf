# ============================================================
# 一键部署的 Web 层入口
#
# 路由分流（顺序即优先级）：
#   1. /admin/api/…   → Go 后端（管理台 API）
#   2. /member/api/…  → Go 后端（会员 API）
#   3. /public/api/…  → Go 后端（对外 API Key 接口）
#   4. /health        → Go 后端健康检查（含 DB/Redis 状态）
#   5. .php 文件      → PHP-FPM（前台 do.php / api.php / member.php）
#   6. /<短码>        → Go 后端 /r/<code>（统一跳转 + 统计）
#   7. 其它           → 静态资源 / 管理台 SPA
#
# config.php 在镜像里并不存在，由 init 容器生成到共享卷后软链到站点根目录；
# 这里额外显式 deny，确保即使软链失效也不会被当成静态文件下载（泄露数据库口令）。
# ============================================================

upstream backend_api {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /var/www/dwz;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 10m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：整站强制 HTTPS 后开启，一年有效期（含子域）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：无内联脚本（Cookie 横幅等逻辑均在 app.min.js），JSON-LD 不执行不受限；
    # style 保留 unsafe-inline 以兼容组件内联样式；图片允许 data: 二维码
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # 品牌化 404：未知路径不再回退首页（soft-404），统一返回 404 + 引导页。
    # 代理/PHP 位置各自处理错误，proxy_intercept_errors 默认 off，
    # 后端品牌错误页（短链不存在/过期）不会被替换。
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ---------- Go 后端 API ----------
    location /admin/api/ {
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/dwz-proxy.conf;
        proxy_read_timeout 60s;
    }

    location /member/api/ {
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/dwz-proxy.conf;
        proxy_read_timeout 60s;
    }

    location /public/api/ {
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/dwz-proxy.conf;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend_api/health;
        include /etc/nginx/snippets/dwz-proxy.conf;
        # 只覆盖读超时：proxy_connect_timeout 已由 snippet 统一设置，
        # 重复声明会被 nginx 判为 duplicate directive 而启动失败。
        proxy_read_timeout 5s;
    }

    # ---------- 短链跳转 ----------
    # 必须排在 SPA 回退之前，否则短码会被 try_files 交给 index.html 返回 200 空页。
    # 正则加引号：{6,8} 里的花括号在部分 nginx 版本（Debian 1.22 等）会被
    # 当作配置块起始符，不加引号会直接启动失败 "unknown directive"。
    location ~ "^/[a-z0-5]{6,8}$" {
        proxy_pass http://backend_api/r$uri;
        include /etc/nginx/snippets/dwz-proxy.conf;
        proxy_read_timeout 30s;
    }

    # ---------- PHP 前台 ----------
    location ~ "^/(do|api|batch|member|stats|sitemap|index|rum)\.php$" {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        # 跳转热路径上的统计/webhook 在 fastcgi_finish_request 之后执行，
        # 超时留足余量，但不阻塞用户收到 302。
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------- 管理台 SPA ----------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /member/ {
        try_files $uri $uri/ /member/index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        # =404 而非回退 /index.html：避免一切无效 URL 变成首页的重复内容
        try_files $uri $uri/ =404;
    }

    # sitemap 规范路径：/sitemap.xml 由 sitemap.php 生成
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    # PWA manifest 的标准 MIME（nginx 默认 mime.types 不含 webmanifest）
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # 404 引导页仅供 error_page 内部使用，禁止直接访问
    location = /404.html {
        internal;
    }

    # ---------- 安全：拒绝敏感路径 ----------
    # 配置文件、安装脚本、迁移、日志、版本控制、备份一律不可访问。
    location ~* "/(config\.php|config\.sample\.php|setup\.php|install\.sql)$" {
        deny all;
        return 404;
    }

    location ~* "\.(?:sql|log|env|bak|old|orig|save|swp|sh|md|ya?ml)$" {
        deny all;
        return 404;
    }

    location ~* "^/(includes|migrations|logs|backend|frontend|deploy|docs|ops)(/|$)" {
        deny all;
        return 404;
    }

    location ~ "/\.(?!well-known)" {
        deny all;
        return 404;
    }
}
