server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_vary on;

    # 静态资源长缓存（Vite 构建产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 反代 IP 统一使用覆盖式赋值（$remote_addr），不能用
    # $proxy_add_x_forwarded_for：后者会把客户端自带的 X-Forwarded-For 追加进来，
    # 访客即可伪造来源 IP 绕过限流、污染登录锁定与地域统计。
    # 管理后台 API 反向代理（backend 为 docker-compose 服务名）
    location /admin/api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 公共短码跳转（如 https://host/abc123）。
    # 必须在 location / 之前，否则会被 SPA 回退 try_files 交给 index.html
    # 返回 200 空页，短链核心功能在容器部署中失效。
    # $uri 自带前导斜杠，"r$uri" 得到 /r/<code>，匹配 Go 后端 /r/:code 路由。
    location ~ ^/[a-z0-5]{6,8}$ {
        proxy_pass         http://backend:8080/r$uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件直接拒绝
    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
