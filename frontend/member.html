<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d5c63'/%3E%3Cpath d='M10.5 13.5a3.5 3.5 0 0 1 0-5l2-2a3.54 3.54 0 0 1 5 5l-1.2 1.2' stroke='%23f5a623' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M13.5 10.5a3.5 3.5 0 0 1 0 5l-2 2a3.54 3.54 0 0 1-5-5l1.2-1.2' stroke='%23ffffff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="短网址 — 我的短链、点击统计与批量管理" />
    <meta name="theme-color" content="#0e6e75" />
    <title>会员中心 - 短网址</title>
    <!-- 字体与后台保持同一镜像/回退策略，避免同站两套字体加载行为 -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link
      href="https://fonts.googleapis.cn/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap'"
    />
    <script>
      // 与 index.html 保持同一兜底策略：镜像 200 但内容异常时探测并回退官方源。
      (function () {
        if (!document.fonts || !document.fonts.ready) return;
        var switched = false;
        setTimeout(function () {
          document.fonts.ready.then(function () {
            if (switched || document.fonts.check('16px Manrope')) return;
            switched = true;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap';
            document.head.appendChild(link);
          });
        }, 3000);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/member-main.ts"></script>
  </body>
</html>
